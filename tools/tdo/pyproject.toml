[project]
name = "tdo"
version = "0.1.0"
description = "3DO dev harness: scriptable Opera emulator host, CLI, MCP server and DevBench (web UI + REST)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "pygame-ce>=2.4",
  "mcp>=2.3,<3",
  "capstone>=5",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.scripts]
tdo = "tdo.cli:main"
tdo-mcp = "tdo.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdo"]
